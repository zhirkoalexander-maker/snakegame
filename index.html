<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { font-size: 2.5em; color: #00ff00; margin-bottom: 20px; }
        .game-wrapper {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            margin: 20px auto;
        }
        canvas { display: block; background: #000; border-radius: 5px; }
        .score { font-size: 1.3em; color: #00ff00; margin: 10px 0; }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button { 
            padding: 10px 20px; 
            font-size: 1em; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background: #00ff00; color: #000; }
        .btn-primary:hover { background: #00cc00; }
        .btn-secondary { background: #333; color: #fff; border: 2px solid #00ff00; }
        .btn-secondary:hover { background: #444; }
        #menu, #gameOver {
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #00ff00;
            max-width: 500px;
        }
        #menu h2, #gameOver h2 { color: #00ff00; margin-bottom: 20px; }
        .menu-option {
            background: rgba(0, 255, 0, 0.1);
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 2px solid #00ff00;
            cursor: pointer;
        }
        .menu-option:hover { background: rgba(0, 255, 0, 0.2); }
        .hidden { display: none !important; }
        .footer {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
            border: 1px solid #00ff00;
            max-width: 500px;
            text-align: center;
            font-size: 0.9em;
            color: #aaa;
        }
        .footer a { color: #00ff00; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>🐍 Snake Game</h1>
    
    <div id="menu">
        <h2>Menu</h2>
        <div id="menuContent"></div>
    </div>
    
    <div id="gameScreen" class="hidden">
        <div class="score">Score: <span id="score1">0</span></div>
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>
        <div class="buttons">
            <button id="pauseBtn" class="btn-secondary" onclick="togglePause()">Pause</button>
            <button class="btn-primary" onclick="restartGame()">Restart</button>
            <button class="btn-secondary" onclick="backToMenu()">Menu</button>
        </div>
    </div>
    
    <div id="gameOver" class="hidden">
        <h2>Game Over!</h2>
        <p class="score">Score: <span id="finalScore1">0</span></p>
        <div class="buttons">
            <button class="btn-primary" onclick="restartGame()">Play Again</button>
            <button class="btn-secondary" onclick="backToMenu()">Menu</button>
        </div>
    </div>
    
    <div class="footer">
        <p>Snake Game | <a href="https://github.com/zhirkoalexander-maker/snakegame" target="_blank">GitHub</a></p>
    </div>
    
    <script src="snake_game_web.js"></script>
</body>
</html>
